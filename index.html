<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26357E">
<title>Almanca Defterim — B1 Tekrar</title>
<style>
  :root{
    --paper:#FBFAF4; --grid:rgba(53,78,158,.10); --ink:#26357E; --ink-soft:#5B67A8;
    --ink-faint:#8A93C4; --line:#D8DCEC; --hl:#FFE9A0; --hl-deep:#F7CE46;
    --green:#2F7D4F; --green-bg:#E4F2E9; --red:#B5442F; --red-bg:#F9E7E2; --white:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; padding:0 12px 90px; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;
  }
  .serif{font-family:Georgia,"Times New Roman",serif}
  .wrap{max-width:720px;margin:0 auto}
  header .cover{
    background:var(--white); border:1.5px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
    border-radius:10px; padding:16px 18px; margin-top:16px;
  }
  .eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 4px}
  h1{font-style:italic;font-size:26px;margin:0}
  .counts{font-size:11px;color:var(--ink-soft);text-align:right;line-height:1.7}
  .cover-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .bar-label{font-size:10px;color:var(--ink-faint);margin:0 0 4px}
  .bar{height:7px;background:#E7EAF5;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
  nav.tabs{display:flex;gap:8px;margin:16px 0 10px;flex-wrap:wrap;align-items:center}
  .chip{
    border:1px solid var(--line); background:var(--white); color:var(--ink-soft);
    border-radius:99px; padding:8px 16px; font-size:13px; cursor:pointer;
  }
  .chip.sm{padding:5px 10px;font-size:11px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  ul.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .card{background:var(--white);border:1px solid var(--line);border-left-width:4px;border-radius:10px;overflow:hidden}
  .card.learned{border-color:var(--green)} .card.repeat{border-color:var(--red)}
  .card.done{border-color:var(--green)} .card.repeating{border-color:var(--hl-deep)}
  .card-head{width:100%;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .w-de{font-family:Georgia,serif;font-weight:600;font-size:15px}
  .w-tr{font-size:13px;color:var(--ink-soft);flex-shrink:0;text-align:right}
  .badge{font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
  .badge.rep{background:var(--red-bg);color:var(--red)}
  .tickmark{color:var(--green);font-weight:700;margin-left:6px}
  .card-body{padding:0 14px 14px}
  .meta{font-size:11px;color:var(--ink-faint);margin:0 0 8px}
  .ex{font-size:13px;font-style:italic;margin:0 0 5px;padding-left:10px;border-left:3px solid var(--hl-deep)}
  .actions{display:flex;gap:8px;margin-top:10px}
  .btn{border-radius:99px;padding:8px 14px;font-size:12px;cursor:pointer;border:1px solid}
  .btn-learn{background:var(--green-bg);color:var(--green);border-color:var(--green)}
  .btn-learn.on{background:var(--green);color:#fff}
  .btn-rep{background:var(--red-bg);color:var(--red);border-color:var(--red)}
  .btn-rep.on{background:var(--red);color:#fff}
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);padding:11px 22px;font-size:14px}
  .btn-ghost{background:var(--white);color:var(--ink);border-color:var(--ink);padding:11px 22px;font-size:14px}
  h2.cat{display:inline-block;font-style:italic;font-size:17px;background:var(--hl);padding:2px 8px;margin:18px 0 8px}
  .t-row{display:flex;align-items:center}
  .t-check{background:none;border:0;padding:12px 8px 12px 14px;cursor:pointer;font-size:15px;line-height:1}
  .t-box{display:inline-block;width:15px;height:15px;border:1.5px solid var(--ink-faint);border-radius:3px}
  .t-title{flex:1;text-align:left;background:none;border:0;padding:12px 14px 12px 0;cursor:pointer;font:inherit;color:inherit}
  .t-title b{font-family:Georgia,serif;font-size:14px}
  .t-state{font-size:11px;color:var(--ink-soft);margin-left:6px}
  .t-body{padding:0 14px 14px 38px}
  .t-tr{font-size:13px;color:var(--ink-soft);margin:0 0 10px;line-height:1.55}
  .t-tips{margin:0 0 12px;padding-left:18px;font-size:12px;color:var(--ink-soft);line-height:1.6}
  .t-tips li{margin-bottom:4px}
  .t-table-wrap{overflow-x:auto;margin:0 0 12px}
  .t-table{width:100%;border-collapse:collapse;font-size:11px}
  .t-table th,.t-table td{border:1px solid var(--line);padding:6px 8px;text-align:left}
  .t-table th{background:var(--hl);font-weight:600;color:var(--ink)}
  .t-table td{font-family:Georgia,serif}
  .t-quiz-bar{margin:0 0 14px}
  .t-quiz-bar .btn-primary{font-size:13px;padding:9px 18px}
  .t-quiz-src{font-size:10px;color:var(--ink-faint);margin:8px 0 0}
  .quiz-box{background:var(--white);border:1.5px solid var(--ink);border-radius:10px;padding:18px}
  .quiz-start{border-style:dashed;border-color:var(--ink-soft);text-align:center;padding:28px 18px}
  .quiz-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-bottom:12px}
  .dirtag{background:var(--hl);color:var(--ink);padding:2px 8px;border-radius:5px}
  .quiz-q{font-family:Georgia,serif;font-size:20px;margin:0 0 16px}
  .opt{display:block;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:8px;cursor:pointer;color:var(--ink);font-family:inherit}
  .opt.ok{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .opt.bad{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .result h2{font-style:italic;font-size:24px;margin:0 0 6px}
  .wronglist{list-style:none;padding:0;margin:0 0 16px;font-size:13px;color:var(--red)}
  .wronglist span{color:var(--ink-soft)}
  .muted{color:var(--ink-faint);font-size:12px}
  .empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:32px 0}
  .savenote{font-size:11px;color:var(--green);margin-left:auto}
  @media(min-width:520px){ h1{font-size:30px} }
</style>
  <script src="topics-data.js"></script>
</head>

const KEY = "b1-defterim-v1";
const WORDS = DATA.words;
const TOPICS = typeof TOPICS_DATA !== "undefined" ? TOPICS_DATA : [];

// ————— durum —————
let state = { words:{}, topics:{} };
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch(e){}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      const n = document.getElementById("savenote");
      n.textContent = "Kaydedildi ✓"; setTimeout(()=>{ n.textContent=""; }, 1400);
    }catch(e){}
  }, 250);
}

// ————— yardımcılar —————
const $ = (id)=>document.getElementById(id);
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function sortLetter(w){ return w.g.replace(/^(der|die|das|sich)\s+/i,"")[0].toUpperCase(); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function wstat(g){ return state.words[g] || "new"; }
function tstat(t){ return state.topics[t] || "new"; }

// ————— filtreler —————
let level="Hepsi", letter="Hepsi", status="hepsi", openWord=null, openTopic=null;

function renderHeader(){
  const learned = WORDS.filter(w=>wstat(w.g)==="learned").length;
  const done = TOPICS.filter(t=>tstat(t.title)==="done").length;
  $("c-words").textContent = learned + "/" + WORDS.length;
  $("c-topics").textContent = done + "/" + TOPICS.length;
  $("bar-w").style.width = Math.round(learned/WORDS.length*100) + "%";
  $("bar-t").style.width = Math.round(done/TOPICS.length*100) + "%";
}

function chipRow(el, items, current, onpick, small){
  el.innerHTML = "";
  items.forEach(([val,label])=>{
    const b = document.createElement("button");
    b.className = "chip" + (small?" sm":"") + (val===current?" on":"");
    b.textContent = label;
    b.onclick = ()=>onpick(val);
    el.appendChild(b);
  });
}

function renderFilters(){
  const repC = WORDS.filter(w=>wstat(w.g)==="repeat").length;
  const lrnC = WORDS.filter(w=>wstat(w.g)==="learned").length;
  chipRow($("f-level"), [["Hepsi","Tüm seviyeler"],["A1","A1"],["A2","A2"],["B1","B1"]], level, v=>{level=v; renderWords();});
  const letters = ["Hepsi", ...[...new Set(WORDS.map(sortLetter))].sort()];
  chipRow($("f-letter"), letters.map(l=>[l,l]), letter, v=>{letter=v; renderWords();}, true);
  chipRow($("f-status"), [["hepsi","Hepsi ("+WORDS.length+")"],["yeni","Yeni"],["tekrar","Tekrar ("+repC+")"],["ogrenilen","Öğrenilen ("+lrnC+")"]], status, v=>{status=v; renderWords();}, true);
}

// ————— kelimeler —————
function renderWords(){
  renderFilters(); renderHeader();
  const list = WORDS.filter(w=>{
    if (level!=="Hepsi" && w.lv!==level) return false;
    if (letter!=="Hepsi" && sortLetter(w)!==letter) return false;
    const s = wstat(w.g);
    if (status==="ogrenilen" && s!=="learned") return false;
    if (status==="tekrar" && s!=="repeat") return false;
    if (status==="yeni" && s!=="new") return false;
    return true;
  });
  const ul = $("wordlist");
  ul.innerHTML = "";
  if (!list.length){ ul.innerHTML = '<li class="empty">Bu filtrede kelime yok. Filtreyi değiştirerek devam edin.</li>'; return; }
  list.forEach(w=>{
    const s = wstat(w.g), open = openWord===w.g;
    const li = document.createElement("li");
    li.className = "card " + (s==="learned"?"learned":s==="repeat"?"repeat":"");
    let head = '<button class="card-head"><span class="w-de">'+esc(w.g)
      + (s==="learned"?'<span class="tickmark">✓</span>':"")
      + (s==="repeat"?'<span class="badge rep">tekrar</span>':"")
      + '</span><span class="w-tr">'+esc(w.t)+'</span></button>';
    let body = "";
    if (open){
      body = '<div class="card-body"><p class="meta">'+(w.f?esc(w.f)+" · ":"")+"Seviye "+w.lv+'</p>'
        + (w.e||[]).map(x=>'<p class="ex">'+esc(x)+'</p>').join("")
        + '<div class="actions">'
        + '<button class="btn btn-learn'+(s==="learned"?" on":"")+'" data-a="learned">✓ Öğrendim</button>'
        + '<button class="btn btn-rep'+(s==="repeat"?" on":"")+'" data-a="repeat">↻ Tekrar gerek</button>'
        + '</div></div>';
    }
    li.innerHTML = head + body;
    li.querySelector(".card-head").onclick = ()=>{ openWord = open?null:w.g; renderWords(); };
    li.querySelectorAll("[data-a]").forEach(b=>{
      b.onclick = ()=>{
        const a = b.dataset.a;
        state.words[w.g] = (state.words[w.g]===a) ? "new" : a;
        save(); renderWords();
      };
    });
    ul.appendChild(li);
  });
}

// ————— konular —————
function renderTopicBody(t){
  let html = '<p class="t-tr">'+esc(t.tr)+'</p>';
  if (t.tips && t.tips.length){
    html += '<ul class="t-tips">'+t.tips.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  }
  if (t.table && t.table.head && t.table.rows){
    html += '<div class="t-table-wrap"><table class="t-table"><thead><tr>'
      + t.table.head.map(h=>'<th>'+esc(h)+'</th>').join('')
      + '</tr></thead><tbody>'
      + t.table.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')
      + '</tbody></table></div>';
  }
  html += (t.ex||[]).map(x=>'<p class="ex">'+esc(x)+'</p>').join('');
  return html;
}

function renderTopics(){
  renderHeader();
  const root = $("view-topics");
  root.innerHTML = "";

  const bar = document.createElement("div");
  bar.className = "t-quiz-bar";
  bar.innerHTML = '<button class="btn btn-primary" id="tq-start">Konu Testi — 8 soru</button>'
    + '<p class="t-quiz-src">Gramer kurallarından rastgele sorular · Konular sekmesinde kalır</p>';
  root.appendChild(bar);
  $("tq-start").onclick = ()=>{ topicQuiz = null; switchTab("topic-quiz"); };

  [...new Set(TOPICS.map(t=>t.cat))].forEach(cat=>{
    const h = document.createElement("h2");
    h.className = "cat serif"; h.textContent = cat; root.appendChild(h);
    const ul = document.createElement("ul"); ul.className = "cards";
    TOPICS.filter(t=>t.cat===cat).forEach(t=>{
      const s = tstat(t.title), open = openTopic===t.title;
      const li = document.createElement("li");
      li.className = "card " + (s==="done"?"done":s==="repeating"?"repeating":"");
      const mark = s==="done" ? '<span class="tickmark">✓</span>'
                 : s==="repeating" ? '<span style="color:var(--hl-deep)">↻</span>'
                 : '<span class="t-box"></span>';
      li.innerHTML = '<div class="t-row">'
        + '<button class="t-check" title="Durumu değiştir">'+mark+'</button>'
        + '<button class="t-title"><b>'+esc(t.title)+'</b>'
        + (s==="repeating"?'<span class="t-state">tekrar ediyorum</span>':"")
        + '</button></div>'
        + (open ? '<div class="t-body">'+renderTopicBody(t)+'</div>' : "");
      li.querySelector(".t-check").onclick = ()=>{
        const order = ["new","repeating","done"];
        state.topics[t.title] = order[(order.indexOf(s)+1)%order.length];
        save(); renderTopics();
      };
      li.querySelector(".t-title").onclick = ()=>{ openTopic = open?null:t.title; renderTopics(); };
      ul.appendChild(li);
    });
    root.appendChild(ul);
  });
  const note = document.createElement("p");
  note.className = "muted";
  note.textContent = "Kutuya tıklayarak durum değiştirin: boş → ↻ tekrar → ✓ tamam. ⭐ işaretli konular tamamlayıcı konulardır.";
  root.appendChild(note);
}

// ————— konu testi —————
let topicQuiz = null;

function startTopicQuiz(){
  const pool = [];
  TOPICS.forEach(t=>{
    (t.quiz||[]).forEach(q=> pool.push({ topic: t.title, ...q }));
  });
  const qs = shuffle(pool).slice(0, 8);
  topicQuiz = { i: 0, done: false, qs: qs.map(q=>({ ...q, picked: null })) };
  renderTopicQuiz();
}

function renderTopicQuiz(){
  const root = $("view-topics");
  if (!topicQuiz){
    renderTopics();
    return;
  }
  if (topicQuiz.done){
    const ok = topicQuiz.qs.filter(q=>q.picked===q.correct).length;
    const wrong = topicQuiz.qs.filter(q=>q.picked!==q.correct);
    root.innerHTML = '<div class="quiz-box result">'
      + '<h2 class="serif">Konu Testi: '+ok+' / '+topicQuiz.qs.length+'</h2>'
      + '<p style="font-size:13px;color:var(--ink-soft)">'
      + (ok===topicQuiz.qs.length ? "Mükemmel! 🎉" : ok>=6 ? "İyi! Zayıf konuları tekrar edin." : "Konular sekmesinden tekrar çalışın.")
      + '</p>'
      + (wrong.length ? '<ul class="wronglist">'+wrong.map(q=>'<li>✗ '+esc(q.topic)+': '+esc(q.q)+'</li>').join('')+'</ul>' : "")
      + '<div class="actions"><button class="btn btn-primary" id="tq-again">Yeni test</button>'
      + '<button class="btn btn-ghost" id="tq-back">Konulara dön</button></div></div>';
    $("tq-again").onclick = startTopicQuiz;
    $("tq-back").onclick = ()=>{ topicQuiz=null; renderTopics(); };
    return;
  }
  const q = topicQuiz.qs[topicQuiz.i], answered = q.picked!==null;
  root.innerHTML = '<div class="quiz-box">'
    + '<div class="quiz-meta"><span>Soru '+(topicQuiz.i+1)+' / '+topicQuiz.qs.length+'</span>'
    + '<span class="dirtag">'+esc(q.topic)+'</span></div>'
    + '<p class="quiz-q" style="font-size:16px">'+esc(q.q)+'</p>'
    + q.opts.map((o,j)=>{
        let cls = "opt";
        if (answered){ if (j===q.correct) cls+=" ok"; else if (j===q.picked) cls+=" bad"; }
        return '<button class="'+cls+'" data-i="'+j+'" '+(answered?"disabled":"")+'>'+esc(o)+'</button>';
      }).join("")
    + (answered
        ? '<div style="margin-top:12px"><button class="btn btn-primary" id="tq-next">'
          +(topicQuiz.i+1>=topicQuiz.qs.length?"Sonucu gör":"Sonraki →")+'</button></div>'
        : "")
    + '</div>';
  root.querySelectorAll(".opt").forEach(b=>{
    if (answered) return;
    b.onclick = ()=>{ q.picked = +b.dataset.i; renderTopicQuiz(); };
  });
  const nx = $("tq-next");
  if (nx) nx.onclick = ()=>{
    if (topicQuiz.i+1>=topicQuiz.qs.length) topicQuiz.done=true;
    else topicQuiz.i++;
    renderTopicQuiz();
  };
}

// ————— test —————
let quiz = null;
function startQuiz(){
  const rep = shuffle(WORDS.filter(w=>wstat(w.g)==="repeat"));
  const fresh = shuffle(WORDS.filter(w=>wstat(w.g)==="new"));
  const lrn = shuffle(WORDS.filter(w=>wstat(w.g)==="learned"));
  const pool = [...rep, ...fresh, ...lrn].slice(0,10);
  quiz = { i:0, done:false, qs: shuffle(pool).map(w=>{
    const dir = Math.random()<0.5 ? "de-tr" : "tr-de";
    const others = shuffle(WORDS.filter(x=>x.g!==w.g && x.lv===w.lv)).slice(0,3);
    const opts = shuffle([w,...others]).map(x=> dir==="de-tr" ? x.t : x.g);
    return { w, dir, opts, correct: dir==="de-tr" ? w.t : w.g, picked:null };
  })};
  renderQuiz();
}
function renderQuiz(){
  const root = $("view-quiz");
  if (!quiz){
    root.innerHTML = '<div class="quiz-box quiz-start">'
      + '<h2 class="serif" style="font-style:italic;font-size:20px;margin:0 0 6px">Kelime Testi</h2>'
      + '<p style="font-size:13px;color:var(--ink-soft);margin:0 0 4px">10 soru · Almanca ↔ Türkçe karışık yönlü çoktan seçmeli.</p>'
      + '<p class="muted" style="margin:0 0 18px">Önce "tekrar" işaretli kelimeler sorulur; yanlış cevaplar otomatik tekrar listesine eklenir.</p>'
      + '<button class="btn btn-primary" id="qs">Teste başla</button></div>';
    $("qs").onclick = startQuiz;
    return;
  }
  if (quiz.done){
    const ok = quiz.qs.filter(q=>q.picked===q.correct).length;
    const wrong = quiz.qs.filter(q=>q.picked!==q.correct);
    root.innerHTML = '<div class="quiz-box result">'
      + '<h2 class="serif">Sonuç: '+ok+' / '+quiz.qs.length+'</h2>'
      + '<p style="font-size:13px;color:var(--ink-soft)">'
      + (ok===quiz.qs.length ? "Mükemmel! Hepsi doğru. 🎉" : ok>=7 ? "Çok iyi! Yanlışlar tekrar listenize eklendi." : "Yanlış cevaplanan kelimeler tekrar listenize eklendi — Kelimeler sekmesinden çalışabilirsiniz.")
      + '</p>'
      + (wrong.length ? '<ul class="wronglist">'+wrong.map(q=>'<li>✗ '+esc(q.w.g)+' — <span>'+esc(q.w.t)+'</span></li>').join("")+'</ul>' : "")
      + '<div class="actions"><button class="btn btn-primary" id="q-again">Yeni test</button>'
      + '<button class="btn btn-ghost" id="q-goto">Tekrar listeme git</button></div></div>';
    $("q-again").onclick = startQuiz;
    $("q-goto").onclick = ()=>{ quiz=null; status="tekrar"; switchTab("words"); };
    return;
  }
  const q = quiz.qs[quiz.i], answered = q.picked!==null;
  root.innerHTML = '<div class="quiz-box">'
    + '<div class="quiz-meta"><span>Soru '+(quiz.i+1)+' / '+quiz.qs.length+'</span>'
    + '<span class="dirtag">'+(q.dir==="de-tr"?"DE → TR":"TR → DE")+'</span></div>'
    + '<p class="quiz-q">'+esc(q.dir==="de-tr"?q.w.g:q.w.t)+'</p>'
    + q.opts.map(o=>{
        let cls = "opt";
        if (answered){ if (o===q.correct) cls+=" ok"; else if (o===q.picked) cls+=" bad"; }
        return '<button class="'+cls+'" data-o="'+esc(o)+'" '+(answered?"disabled":"")+'>'+esc(o)+'</button>';
      }).join("")
    + (answered
        ? '<div style="margin-top:12px">'
          + (q.w.e && q.w.e[0] ? '<p class="ex" style="color:var(--ink-soft)">'+esc(q.w.e[0])+'</p>' : "")
          + '<button class="btn btn-primary" id="q-next">'+(quiz.i+1>=quiz.qs.length?"Sonucu gör":"Sonraki soru →")+'</button></div>'
        : "")
    + '</div>';
  root.querySelectorAll(".opt").forEach(b=>{
    if (answered) return;
    b.onclick = ()=>{
      q.picked = b.dataset.o;
      if (q.picked !== q.correct){ state.words[q.w.g] = "repeat"; save(); }
      renderQuiz();
    };
  });
  const nx = $("q-next");
  if (nx) nx.onclick = ()=>{ if (quiz.i+1>=quiz.qs.length) quiz.done=true; else quiz.i++; renderQuiz(); };
}

// ————— sekmeler —————
function switchTab(tab){
  document.querySelectorAll("#tabs .chip").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  $("view-words").hidden = tab!=="words";
  $("view-topics").hidden = tab!=="topics" && tab!=="topic-quiz";
  $("view-quiz").hidden = tab!=="quiz";
  if (tab==="words") renderWords();
  if (tab==="topics") { topicQuiz=null; renderTopics(); }
  if (tab==="topic-quiz") { if (!topicQuiz) startTopicQuiz(); else renderTopicQuiz(); }
  if (tab==="quiz") renderQuiz();
}
document.querySelectorAll("#tabs .chip").forEach(b=> b.onclick = ()=>switchTab(b.dataset.tab));

renderWords(); renderHeader();
</script>
